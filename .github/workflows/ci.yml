name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # WHY TYPECHECK IS NOT THE FIRST GATE (2026-08-20). `apps/web/tsconfig.json`
      # includes `.next/types/**/*.ts`, which `next build` GENERATES and
      # `.gitignore` excludes. Running tsc before the build therefore checks a
      # DIFFERENT set of files here than it does on a developer machine that has
      # built once — same commit, same lockfile, different program. That is how a
      # docs-only commit failed this job while the code commit before it passed.
      #
      # The build now runs first so both sides typecheck the same thing. It also
      # means a type error surfaces as a build failure first, which is louder, not
      # quieter.
      - run: pnpm --filter @adgen/web run build
      - run: pnpm run typecheck
      - run: pnpm run lint
      # The suites are the slow-to-write, fast-to-run half of the gate: a logic
      # regression that typechecks and lints (most of them do) is invisible to
      # every other step here. Until 2026-08-16 this workflow ran none of them,
      # so the whole suite gated nothing on a PR.
      - run: pnpm run test

  # Added 2026-08-18 from the Rev. 3 security audit (§3, `security-audit.md`),
  # which is residual risk #6: every security property this repo has was
  # established by a human reading code, so nothing catches a regression between
  # audits. Kept as a SEPARATE job on purpose — a CodeQL run takes minutes, and
  # it must not sit between a push and the build result.
  #
  # Repo visibility is load-bearing here: `stewakg/SaaSUGC` is PUBLIC (checked
  # against the GitHub API, not assumed), which is what makes gitleaks-action v2
  # and CodeQL free and lets gitleaks work with the default GITHUB_TOKEN. If the
  # repo is ever made private, both need revisiting — gitleaks-action wants a
  # GITLEAKS_LICENSE and CodeQL needs Advanced Security.
  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # CodeQL uploads its results to the Security tab
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans HISTORY, not just the tip
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ORDER MATTERS, and the first run of this job proved it. `pnpm audit` was
      # first, it failed on a pre-existing dependency backlog, and GitHub
      # SKIPPED the two steps below it — so the scanners that look for leaked
      # secrets and taint bugs never ran at all. A dependency backlog must never
      # be able to silence those: audit is now LAST, after both.
      #
      # 1) Secrets anywhere in history. This repo has had real near-misses —
      #    `.env.bak-*` on the VPS, and the `.dockerignore` gap that hid a whole
      #    route — so history is worth scanning, not just the working tree. If
      #    an OLD, already-rotated secret ever trips it, write a `.gitleaks.toml`
      #    allowlist entry; do not silence the scan.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 2) CodeQL taint analysis — the SINK side of XSS/SSRF/injection, i.e.
      #    exactly the family that produced this project's only HIGH finding
      #    (mapped-IPv6 SSRF) and its four follow-ups. The first run is triage;
      #    after that it gates.
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
      # 3) Known-vulnerable dependencies, LAST for the reason at the top of this
      #    job. High floor deliberately: lows are noise at this stage.
      #
      #    Two Remotion criticals are ignored via `pnpm.auditConfig.ignoreGhsas`
      #    in the root package.json — they name `<4.0.410` and the lockfile has
      #    only 4.0.490, which is why they print an EMPTY dependency path. The
      #    justification is written there; read it before adding a third.
      - run: pnpm audit --audit-level high