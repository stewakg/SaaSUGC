packages:
  - "apps/*"
  - "packages/*"
  - "remotion"

# Allow native build scripts for these packages.
onlyBuiltDependencies:
  - esbuild
  - ffmpeg-static
  - ffprobe-static
  - msgpackr-extract
  - sharp
  - unrs-resolver
  - youtube-dl-exec

# apps/web pins React 19 RC preview types (@types/react -> types-react@rc).
# Without a scoped override, pnpm's shared peer-dependency slot picks that
# alias for OTHER packages' unrelated "react" type resolution too (e.g. the
# `remotion` npm package's own .d.ts files climb up to this shared slot when
# resolving react types, since remotion pins real React 18) — breaking their
# JSX types. Force the real @types/react everywhere except apps/web itself.
overrides:
  "@adgen/web>@types/react": "npm:types-react@rc"
  "@adgen/web>@types/react-dom": "npm:types-react-dom@rc"
  "@types/react": "18.3.12"
  "@types/react-dom": "18.3.1"
  # @aws-sdk/client-s3 and @aws-sdk/s3-request-presigner resolved DIFFERENT
  # copies of @smithy/core. Both work at runtime, but the `Client` class carries
  # a private `handers` field, and TypeScript compares private members
  # nominally — so passing an S3Client to getSignedUrl failed to typecheck with
  # "Types have separate declarations of a private property 'handlers'".
  # One copy each, and the two packages agree again.
  "@smithy/core": "3.31.1"
  "@smithy/signature-v4": "5.6.12"

# NOTE: `auditConfig` does NOT belong here. It was tried in this file first
# (alongside `overrides` and `onlyBuiltDependencies`, which pnpm 10 does read
# from here) and pnpm 10.0.0 ignored it silently — the audit still reported the
# entries. It lives in the root `package.json` under "pnpm" instead. Recorded so
# nobody moves it back on the reasonable assumption that all pnpm settings live
# together.
