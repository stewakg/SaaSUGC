# =============================================================================
# Production worker deployment (F6) — for the user's existing Hetzner VPS.
# Isolated via its own compose project name (-p adgen) and container names,
# so it can't collide with anything else on that box.
#
# LIVE-VERIFIED 2026-07-18: running as `adgen-worker-prod` + `adgen-redis-prod`
# at /opt/adgen-saas on the VPS; a real job was processed end-to-end through
# this exact stack (see INFRASTRUCTURE.md F2/F6).
#
# Usage (from the repo root on the VPS):
#   docker compose -f infra/docker-compose.prod.yml -p adgen up -d --build
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: adgen-redis-prod
    restart: unless-stopped
    # `--requirepass` is what makes the loopback bind below a second lock rather
    # than the only one. Today nothing else runs on this box, so the bind is
    # genuinely sufficient — but the queue holds every job and BullMQ trusts
    # whatever is in it, and the moment a second container, a second project, or
    # the mooted join with the `aikutak` box shares this host, an unauthenticated
    # Redis is reachable from it. Cheap now, awkward later.
    #
    # REDIS_PASSWORD comes from /srv/adgen/.env, which the deploy already sources
    # (`set -a && . ./.env && set +a`). If it is EMPTY, redis-server refuses to
    # start rather than starting open — a visibly broken deploy beats a silently
    # unprotected one.
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD must be set}']
    environment:
      # Only so the healthcheck below can authenticate. redis-server itself gets
      # the password through --requirepass above, not from here.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      # `redis-cli ping` answers NOAUTH once requirepass is set, so the bare
      # probe would never go healthy and `depends_on: service_healthy` would
      # block the whole stack from starting. It must authenticate.
      #
      # `$$REDIS_PASSWORD` (doubled) is escaped for COMPOSE, so the shell inside
      # the container expands it — compose must not interpolate it into the yaml,
      # or the password ends up in `docker inspect` output as a literal.
      # --no-auth-warning keeps the credential out of the container's stderr.
      test:
        [
          'CMD',
          'sh',
          '-c',
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Loopback-only: reachable from processes ON this VPS (and via an SSH
      # port-forward tunneled to that same loopback address) but NOT from the
      # public internet — unauthenticated Redis exposed publicly is a classic
      # botnet target. The worker itself reaches this over the internal
      # compose network by service name, not through this port.
      - '127.0.0.1:6379:6379'

  worker:
    build:
      context: ../
      dockerfile: apps/worker/Dockerfile
    container_name: adgen-worker-prod
    restart: unless-stopped
    env_file:
      - ../apps/worker/.env
    environment:
      # Overrides whatever REDIS_URL is in .env — the worker must talk to
      # THIS compose stack's redis service (by its service name on the
      # compose network), not localhost or a dev instance.
      # Password from the same env var redis-server requires above. The
      # `:?` form fails the deploy loudly if it is unset, rather than silently
      # connecting without credentials to a server that now demands them.
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      # One render at a time on a render box. The code default is 4, which is
      # right for the cheap tools and wrong for matrix: a single Remotion render
      # already drives Chromium and ffmpeg to near-100% on every core and wants
      # ~2 GB, so four in parallel thrash and the likely ending is an OOM kill —
      # which surfaces as jobs failing under load, the worst moment to find out.
      # Raise it only after `bench-render.ts` shows the box has headroom.
      WORKER_CONCURRENCY: '1'
      # The image sets NODE_ENV=production, so the mock-provider guard is armed:
      # if any provider resolves to a mock this container REFUSES to start and,
      # with restart: unless-stopped, will visibly crash-loop. That is deliberate
      # — a worker on mocks answers paid jobs with canned output. Fix the keys in
      # apps/worker/.env rather than setting ALLOW_MOCK_PROVIDERS.
    depends_on:
      redis:
        condition: service_healthy
    # Liveness = "did the event loop beat recently", not "does the process
    # exist". The worker writes adgen:worker:heartbeat to Redis every 15s from
    # inside its own event loop (apps/worker/src/health.ts); a blocked loop or a
    # dead Redis socket stops the writes and this probe goes unhealthy. Fresh is
    # < 60s old (HEARTBEAT_STALE_MS), future timestamps count as fresh so clock
    # skew can't cause a restart loop. Uses node + ioredis, both already in the
    # image — same no-extra-dependency trick as the web healthcheck below.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const R=require('ioredis');const c=new R(process.env.REDIS_URL);c.get('adgen:worker:heartbeat').then(v=>{c.quit();process.exit(v&&Date.now()-Number(v)<60000?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
      # The only two values the BUILD needs, and both are public by design.
      # Export them before running compose:
      #   set -a; . ./.env; set +a; docker compose -f infra/... up -d --build
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: adgen-web-prod
    restart: unless-stopped
    env_file:
      - ../apps/web/.env
    environment:
      # Same reasoning as the worker: the app must reach THIS stack's redis by
      # service name, not whatever REDIS_URL the .env carries for local dev.
      # Password from the same env var redis-server requires above. The
      # `:?` form fails the deploy loudly if it is unset, rather than silently
      # connecting without credentials to a server that now demands them.
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      NODE_ENV: production
    ports:
      # Port 80 straight to Next, no reverse proxy yet: there is no domain, so
      # there is no certificate to get. Caddy goes in front the moment a domain
      # exists — that is the only change needed for TLS.
      - '80:3000'
    # Without this, compose reports a hung Next process as "Up" and no restart
    # policy fires — the container is running, it just answers nothing. Uses
    # node, already in the image, so no curl/wget dependency is added.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy

  # TLS terminator. Behind the `tls` profile, so it does NOT start with a plain
  # `docker compose up -d` — today's deploy is byte-for-byte unchanged and this
  # service simply sits here until there is a domain to serve.
  #
  # Turning it on is three steps and they are written down in infra/Caddyfile;
  # the one that will bite is step 2: `web` must give up its `80:3000` mapping
  # first, because Caddy needs port 80 for the ACME challenge and will not start
  # while web holds it.
  #
  # Caddy renews its own Let's Encrypt certificate. The two named volumes are
  # what make that true across restarts — `caddy_data` holds the certificates
  # and the ACME account key, and losing it means re-issuing every certificate
  # from scratch, straight into Let's Encrypt's rate limits. Do not prune it.
  caddy:
    image: caddy:2-alpine
    container_name: adgen-caddy-prod
    restart: unless-stopped
    profiles: ['tls']
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      # Set in /srv/adgen/.env. Caddy reads it as {$ADGEN_DOMAIN}; with it unset
      # Caddy fails to start rather than serving on a wrong hostname.
      ADGEN_DOMAIN: ${ADGEN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  redis_data:
  caddy_data:
  caddy_config:
