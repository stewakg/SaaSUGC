# =============================================================================
# Production worker deployment (F6) — for the user's existing Hetzner VPS.
# Isolated via its own compose project name (-p adgen) and container names,
# so it can't collide with anything else on that box.
#
# LIVE-VERIFIED 2026-07-18: running as `adgen-worker-prod` + `adgen-redis-prod`
# at /opt/adgen-saas on the VPS; a real job was processed end-to-end through
# this exact stack (see INFRASTRUCTURE.md F2/F6).
#
# Usage (from the repo root on the VPS):
#   docker compose -f infra/docker-compose.prod.yml -p adgen up -d --build
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: adgen-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Loopback-only: reachable from processes ON this VPS (and via an SSH
      # port-forward tunneled to that same loopback address) but NOT from the
      # public internet — unauthenticated Redis exposed publicly is a classic
      # botnet target. The worker itself reaches this over the internal
      # compose network by service name, not through this port.
      - '127.0.0.1:6379:6379'

  worker:
    build:
      context: ../
      dockerfile: apps/worker/Dockerfile
    container_name: adgen-worker-prod
    restart: unless-stopped
    env_file:
      - ../apps/worker/.env
    environment:
      # Overrides whatever REDIS_URL is in .env — the worker must talk to
      # THIS compose stack's redis service (by its service name on the
      # compose network), not localhost or a dev instance.
      REDIS_URL: redis://redis:6379
      # One render at a time on a render box. The code default is 4, which is
      # right for the cheap tools and wrong for matrix: a single Remotion render
      # already drives Chromium and ffmpeg to near-100% on every core and wants
      # ~2 GB, so four in parallel thrash and the likely ending is an OOM kill —
      # which surfaces as jobs failing under load, the worst moment to find out.
      # Raise it only after `bench-render.ts` shows the box has headroom.
      WORKER_CONCURRENCY: '1'
      # The image sets NODE_ENV=production, so the mock-provider guard is armed:
      # if any provider resolves to a mock this container REFUSES to start and,
      # with restart: unless-stopped, will visibly crash-loop. That is deliberate
      # — a worker on mocks answers paid jobs with canned output. Fix the keys in
      # apps/worker/.env rather than setting ALLOW_MOCK_PROVIDERS.
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
