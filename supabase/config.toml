# For detailed config reference, see:
# https://supabase.com/docs/guides/local-development/cli/config
#
# Local Supabase stack for adgen-saas. Started with `supabase start`.
# Applies migrations in supabase/migrations automatically (incl. 0001_init_schema.sql).

project_id = "adgen-saas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_project_name = "adgen-shadow"

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 15
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false
# F5: enable Google OAuth here and set the env-provided secrets.

[edge_runtime]
enabled = true
inspector_port = 8083

[analytics]
enabled = false